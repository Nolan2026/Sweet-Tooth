<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Tooth Backend | API Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-light: #ff8fa3;
            --secondary: #590d22;
            --bg: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --success: #00f5d4;
            --error: #ff5a5f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 77, 109, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(89, 13, 34, 0.2) 0%, transparent 50%);
        }

        .container {
            text-align: center;
            padding: 3rem;
            border-radius: 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: var(--primary);
            filter: blur(40px);
            opacity: 0.3;
            z-index: 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.6rem 1.2rem;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.2);
            border-radius: 50px;
            color: var(--success);
            font-weight: 600;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(0, 245, 212, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 212, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 245, 212, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 212, 0); }
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .link-btn {
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .link-btn:hover {
            opacity: 1;
            color: var(--primary-light);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo-icon">🍰</div>
            <div class="logo-glow"></div>
        </div>
        <h1>Sweet Tooth</h1>
        <p>Advanced Backend API Services</p>
        
        <div class="status-badge">
            <div class="pulse"></div>
            <span>System Operational</span>
        </div>

        <div class="links">
            <a href="/health" class="link-btn">Health Check</a>
            <a href="/docs" class="link-btn">API Docs</a>
            <a href="https://github.com" class="link-btn">GitHub</a>
        </div>

        <div class="footer">
            &copy; 2026 Sweet Tooth Team. All rights reserved.
        </div>
    </div>
</body>
</html>
