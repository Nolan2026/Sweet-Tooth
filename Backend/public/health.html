<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Check | Sweet Tooth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --success: #00f5d4;
            --bg: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 245, 212, 0.05) 0%, transparent 70%);
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.4rem 1rem;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.2);
            border-radius: 50px;
            color: var(--success);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 212, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 245, 212, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 212, 0); }
        }

        .data-grid {
            display: grid;
            gap: 1rem;
        }

        .data-item {
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .label {
            display: block;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            word-break: break-all;
        }

        .refresh-btn {
            margin-top: 2rem;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), #590d22);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--primary-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Health Diagnostics</h1>
            <div class="status-pill">
                <div class="pulse"></div>
                <span>Healthy</span>
            </div>
        </div>

        <div class="data-grid">
            <div class="data-item">
                <span class="label">Status</span>
                <span class="value" id="status-val">Loading...</span>
            </div>
            <div class="data-item">
                <span class="label">Uptime</span>
                <span class="value" id="uptime-val">Calculating...</span>
            </div>
            <div class="data-item">
                <span class="label">Database Check</span>
                <span class="value" id="db-val">Pinging...</span>
            </div>
            <div class="data-item">
                <span class="label">Timestamp</span>
                <span class="value" id="time-val">-</span>
            </div>
        </div>

        <button class="refresh-btn" onclick="fetchHealth()">Refresh Diagnostics</button>
        <a href="/" class="back-link">Return to Dashboard</a>
    </div>

    <script>
        async function fetchHealth() {
            const statusEl = document.getElementById('status-val');
            const timeEl = document.getElementById('time-val');
            const uptimeEl = document.getElementById('uptime-val');
            const dbEl = document.getElementById('db-val');

            try {
                // Use an absolute path from the root
                const res = await fetch('/health?json=true&t=' + Date.now());
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                
                const data = await res.json();
                
                statusEl.textContent = data.status.toUpperCase();
                statusEl.style.color = 'var(--success)';
                
                timeEl.textContent = new Date(data.timestamp).toLocaleString();
                
                // Format uptime (seconds to HMS)
                const s = data.uptime;
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                const sec = s % 60;
                uptimeEl.textContent = `${h}h ${m}m ${sec}s`;
                
                dbEl.textContent = data.database.toUpperCase();
                if (data.database.toLowerCase().includes('connected') && !data.database.toLowerCase().includes('dis')) {
                    dbEl.style.color = 'var(--success)';
                } else {
                    dbEl.style.color = 'var(--error)';
                }
            } catch (err) {
                console.error('Health check failed:', err);
                statusEl.textContent = 'UNREACHABLE';
                statusEl.style.color = 'var(--error)';
                dbEl.textContent = 'ERROR';
                dbEl.style.color = 'var(--error)';
                timeEl.textContent = 'N/A';
                uptimeEl.textContent = 'N/A';
            }
        }

        fetchHealth();
    </script>
</body>
</html>
