  <!-- JSON-LD 1: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Sweet Tooth",
    "url": "https://sweettooth.com",
    "logo": "https://sweettooth.com/frontend_img.png",
    "sameAs": ["https://instagram.com/sweettooth", "https://facebook.com/sweettooth"],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "availableLanguage": ["English", "Hindi"]
    }
  }
  </script>

  <!-- JSON-LD 2: LocalBusiness -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FoodEstablishment",
    "name": "Sweet Tooth",
    "description": "Authentic homemade Indian sweets, snacks and pickles delivered across India",
    "servesCuisine": "Indian",
    "priceRange": "₹₹",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Sweets, Snacks & Pickles",
      "itemListElement": [
        { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Indian Sweets" }},
        { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Namkeen Snacks" }},
        { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Homemade Pickles" }}
      ]
    }
  }
  </script>

  <!-- JSON-LD 3: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What types of Indian sweets can I order online?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We offer a wide variety of homemade Indian sweets, including Kaju Katli, traditional laddoos, barfis, and seasonal specialties."
        }
      },
      {
        "@type": "Question",
        "name": "Do you offer home delivery for pickles and snacks across India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes! We ship our authentic achaar and crispy namkeen securely across India with fast home delivery."
        }
      },
      {
        "@type": "Question",
        "name": "Are the sweets and snacks homemade or factory-made?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "All our products are freshly homemade in small batches using traditional family recipes to preserve authentic flavors."
        }
      },
      {
        "@type": "Question",
        "name": "Can I order a custom sweet hamper or gift box online?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, we create custom Indian sweets and snacks gift boxes perfect for weddings, corporate gifting, and festive occasions."
        }
      },
      {
        "@type": "Question",
        "name": "What is the shelf life of your pickles and snacks?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Our homemade namkeen stays fresh for 3-4 weeks, and traditional pickles last up to 6 months without artificial preservatives."
        }
      },
      {
        "@type": "Question",
        "name": "Do you offer bulk orders for weddings and festivals?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Absolutely! We cater to bulk orders for traditional Indian sweets and namkeen for Diwali, weddings, and special events."
        }
      }
    ]
  }
  </script>
